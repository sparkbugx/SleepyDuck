<!--
  Full-bleed artwork with the form resting on the empty paper to the right of the poster.
  On large screens the image is anchored right so that paper band stays in view; on
  smaller screens it's centered on the poster and the card floats over it.
-->
<div class="relative min-h-dvh overflow-hidden bg-[#f3ead9] font-sans text-stone-900">
  <img
    src="bonsai.jpeg"
    alt=""
    class="absolute inset-0 size-full object-cover object-center lg:object-right"
    fetchpriority="high"
  />

  <main class="relative flex min-h-dvh items-center justify-center px-4 py-10 lg:justify-end lg:pr-[max(1.5rem,calc(16vw_-_200px))]">
    <div class="w-full max-w-[400px] rounded-2xl border border-stone-900/10 bg-[#fcfaf5]/90 px-8 py-10 shadow-2xl shadow-stone-900/15 backdrop-blur-sm sm:px-10">
      <div class="flex justify-center">
        <img src="favicon.svg" alt="SleepyDuck" class="size-9" />
      </div>

      <div class="mt-7 text-center">
        <h1 class="font-display text-4xl font-medium tracking-tight text-stone-900">Welcome back!</h1>
        <p class="mt-3 text-sm text-stone-500">Your work, your team, your flow — all in one place.</p>
      </div>

      <div class="mt-8 grid grid-cols-2 gap-3">
        <button
          type="button"
          class="flex cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-full border border-stone-300 bg-white/70 px-3 py-2.5 text-xs font-medium text-stone-800 transition-colors duration-200 hover:bg-white"
          (click)="login()"
          aria-label="Sign in with Google"
        >
          <svg class="size-4" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1Z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.290-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z" />
            <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A10.97 10.97 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38Z" />
          </svg>
          Google
        </button>

        <button
          type="button"
          class="flex cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-full border border-stone-300 bg-white/70 px-3 py-2.5 text-xs font-medium text-stone-800 transition-colors duration-200 hover:bg-white"
          (click)="login()"
          aria-label="Sign in with Apple"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M16.37 12.7c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-2.99-.79a4.43 4.43 0 0 0-3.750 2.27c-1.6 2.77-.41 6.88 1.15 9.13.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.770.74 2.98.72 1.24-.02 2.02-1.12 2.77-2.23a9.8 9.8 0 0 0 1.26-2.58 3.98 3.98 0 0 1-2.42-3.65ZM14.1 5.96a3.98 3.98 0 0 0 .92-2.86 4.06 4.06 0 0 0-2.63 1.36 3.8 3.8 0 0 0-.94 2.76c1 .08 2.03-.51 2.650-1.26Z" />
          </svg>
          Apple
        </button>
      </div>

      <div class="my-6 flex items-center gap-4" role="separator">
        <span class="h-px flex-1 bg-stone-300/70"></span>
        <span class="text-xs text-stone-400">Or</span>
        <span class="h-px flex-1 bg-stone-300/70"></span>
      </div>

      <form class="space-y-3" (submit)="login($event)">
        <label for="login-email" class="sr-only">Email</label>
        <input
          id="login-email"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="Enter your email"
          class="w-full rounded-xl border border-stone-300 bg-white px-4 py-3 text-sm text-stone-900 placeholder:text-stone-400 transition-colors duration-200 focus:border-stone-500 focus:outline-none"
        />
        <button
          type="submit"
          class="w-full cursor-pointer rounded-full bg-stone-900 px-4 py-3 text-sm font-medium text-[#fcfaf5] transition-all duration-200 hover:bg-stone-700 active:scale-[0.99]"
        >
          Sign in with email
        </button>
      </form>

      <p class="mt-7 text-center text-xs text-stone-500">
        Don't have an account?
        <a href="#" class="ml-1.5 font-medium text-stone-900 underline underline-offset-4" (click)="login($event)">Sign Up</a>
      </p>
    </div>
  </main>
</div>

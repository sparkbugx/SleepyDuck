<!--
  Full-bleed artwork, pushed to pure black and white, with the form resting on the empty
  paper to the right of the poster. On large screens the image is anchored right so that
  paper band stays in view; on smaller screens it's centered and the card sits over it.
  The page is always light, because the artwork is ink on paper.
-->
<div class="relative min-h-dvh overflow-hidden bg-ink-paper font-sans text-ink-charcoal">
  <img
    src="bonsai.jpeg"
    alt=""
    class="absolute inset-0 size-full object-cover object-center mix-blend-multiply contrast-125 grayscale lg:object-right"
    fetchpriority="high"
  />

  <main class="relative flex min-h-dvh items-center justify-center px-4 py-10 lg:justify-end lg:pr-[max(1.5rem,calc(16vw_-_200px))]">
    <div class="w-full max-w-[400px] rounded-none border-4 border-ink-charcoal bg-ink-paper px-8 py-10 shadow-[8px_8px_0_0_#1A1A1A] sm:px-10">
      <div class="flex justify-center">
        <img src="favicon.svg" alt="SleepyDuck" class="size-10" />
      </div>

      <div class="mt-7 text-center">
        <h1 class="font-display text-3xl font-extrabold tracking-tighter text-ink-charcoal uppercase">Welcome back</h1>
        <p class="mt-3 text-sm text-ink-graphite">Your work, your team, your flow — all in one place.</p>
      </div>

      <div class="mt-8 grid grid-cols-2 gap-4">
        <button
          type="button"
          class="flex cursor-pointer items-center justify-center gap-2 rounded-none border-2 border-ink-charcoal bg-ink-paper px-3 py-2.5 font-mono text-xs font-bold tracking-wider whitespace-nowrap text-ink-charcoal uppercase shadow-[3px_3px_0_0_#1A1A1A] transition-[transform,box-shadow,background-color,color] duration-100 hover:bg-ink-charcoal hover:text-ink-paper active:translate-x-[3px] active:translate-y-[3px] active:shadow-none"
          (click)="login()"
          aria-label="Sign in with Google"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 11v3.2h5.1c-.5 2.2-2.4 3.600-5.100 3.600a5.800 5.800 0 1 1 3.700-10.300l2.300-2.300A9 9 0 1 0 12 21c5.200 0 8.700-3.700 8.700-8.800 0-.4 0-.8-.1-1.200H12Z" />
          </svg>
          Google
        </button>

        <button
          type="button"
          class="flex cursor-pointer items-center justify-center gap-2 rounded-none border-2 border-ink-charcoal bg-ink-paper px-3 py-2.5 font-mono text-xs font-bold tracking-wider whitespace-nowrap text-ink-charcoal uppercase shadow-[3px_3px_0_0_#1A1A1A] transition-[transform,box-shadow,background-color,color] duration-100 hover:bg-ink-charcoal hover:text-ink-paper active:translate-x-[3px] active:translate-y-[3px] active:shadow-none"
          (click)="login()"
          aria-label="Sign in with Apple"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M16.37 12.7c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-2.99-.79a4.43 4.43 0 0 0-3.750 2.27c-1.6 2.77-.41 6.88 1.15 9.13.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.770.74 2.98.72 1.24-.02 2.02-1.12 2.77-2.23a9.8 9.8 0 0 0 1.26-2.58 3.98 3.98 0 0 1-2.42-3.65ZM14.1 5.96a3.98 3.98 0 0 0 .92-2.86 4.06 4.06 0 0 0-2.63 1.36 3.8 3.8 0 0 0-.94 2.76c1 .08 2.03-.51 2.650-1.26Z" />
          </svg>
          Apple
        </button>
      </div>

      <div class="my-6 flex items-center gap-4" role="separator">
        <span class="h-0.5 flex-1 bg-ink-charcoal"></span>
        <span class="font-mono text-xs font-bold text-ink-charcoal uppercase">Or</span>
        <span class="h-0.5 flex-1 bg-ink-charcoal"></span>
      </div>

      <form class="space-y-4" (submit)="login($event)">
        <label for="login-email" class="sr-only">Email</label>
        <input
          id="login-email"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="Enter your email"
          class="w-full rounded-none border-2 border-ink-charcoal bg-ink-paper px-4 py-3 text-sm text-ink-charcoal placeholder:text-ink-graphite focus:outline-[3px] focus:outline-offset-2 focus:outline-ink-charcoal"
        />
        <button
          type="submit"
          class="w-full cursor-pointer rounded-none border-2 border-ink-charcoal bg-ink-charcoal px-4 py-3 font-mono text-sm font-bold tracking-wider text-ink-paper uppercase shadow-[4px_4px_0_0_#8A8A8A] transition-[transform,box-shadow,background-color,color] duration-100 hover:bg-ink-paper hover:text-ink-charcoal active:translate-x-1 active:translate-y-1 active:shadow-none"
        >
          Sign in with email
        </button>
      </form>

      <p class="mt-7 text-center text-xs text-ink-graphite">
        Don't have an account?
        <a href="#" class="ml-1.5 font-bold text-ink-charcoal underline decoration-2 underline-offset-4" (click)="login($event)">Sign Up</a>
      </p>
    </div>
  </main>
</div>

services:
  postgres:
    image: postgres:16-alpine
    container_name: sleepyduck-postgres
    environment:
      POSTGRES_DB: sleepyduck
      POSTGRES_USER: sleepyduck
      POSTGRES_PASSWORD: sleepyduck_dev
    ports:
      - "5432:5432"
    volumes:
      - sleepyduck-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleepyduck -d sleepyduck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sleepyduck-pgdata:
